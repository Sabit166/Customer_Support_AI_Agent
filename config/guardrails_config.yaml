# Guardrails Configuration
input_guardrails:
  blocked_topics:
    - "politics"
    - "religion" 
    - "medical_advice"
    - "legal_advice"
    - "personal_information"
    - "financial_advice"
  
  blocked_keywords:
    - "hack"
    - "illegal"
    - "violence"
    - "discrimination"
  
  max_message_length: 1000
  
output_guardrails:
  safety_filters:
    - "toxicity"
    - "bias"
    - "inappropriate_content"
  
  response_requirements:
    - "professional_tone"
    - "helpful_content"
    - "company_relevant"
  
  max_response_length: 800