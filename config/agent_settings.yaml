# Agent Configuration
agent:
  name: "Customer Support AI"
  model: "gpt-4"
  temperature: 0.3
  max_tokens: 500
  timeout: 30

# Company Information
company:
  name: "TechCorp Solutions"
  support_hours: "9 AM - 6 PM (Mon-Fri)"
  timezone: "UTC"

# Response Templates
templates:
  greeting: "Hello! I'm here to help with your service inquiries and complaints."
  closing: "Is there anything else I can help you with today?"
  escalation: "I understand your concern. Let me escalate this to our specialized team."